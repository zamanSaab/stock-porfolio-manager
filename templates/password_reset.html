<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Stock Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #566387;
            --primary-light: rgba(78, 115, 223, 0.1);
            --success: #1cc88a;
            --success-light: rgba(28, 200, 138, 0.1);
            --purple: #6f42c1;
            --purple-light: rgba(111, 66, 193, 0.1);
            --form-text: #2b3035;
        }
        
        body {
            background: linear-gradient(135deg, #1b1e20 0%, #566387 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .auth-card {
            border: none;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15) !important;
        }
        
        .auth-card-header {
            background: linear-gradient(135deg, #e74a3b 0%, #be2617 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .auth-card-body {
            padding: 2rem;
        }
        
        .auth-card-footer {
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        /* Form styling */
        .form-label {
            color: var(--form-text);
            font-weight: 500;
        }
        
        .form-control {
            color: var(--form-text);
            border-color: #dee2e6;
        }
        
        .form-control:focus {
            color: var(--form-text);
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
        }
        
        .input-group-text {
            background-color: #f8f9fa;
            color: #6c757d;
        }
        
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background-color: #3b4147;
            border-color: #2b3035;
        }
        
        /* .text-primary {
            color: var(--primary) !important;
        } */
        
        .instructions {
            color: var(--form-text);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="auth-card">
                    <div class="auth-card-header">
                        <h3 class="mb-0"><i class="bi bi-key-fill me-2"></i>Password Reset</h3>
                        <p class="mb-0 mt-2">Recover your account</p>
                    </div>
                    
                    <div class="auth-card-body">
                        {% if form.errors %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>Error!</strong> Please correct the errors below.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}
                        
                        <p class="instructions">
                            Enter your email address below, and we'll email instructions for setting a new password.
                        </p>
                        
                        <form method="POST" class="needs-validation" novalidate>
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="id_email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                    <input type="email" name="email" id="id_email" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-send-fill me-2"></i>Send Reset Link
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <div class="auth-card-footer">
                        <p class="mb-0">Remember your password? <a href="{% url 'login' %}" class="text-primary">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Form validation
            const forms = document.querySelectorAll('.needs-validation');
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        });
    </script>
</body>
</html>
