<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | Stock Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* Same CSS as password_reset.html */
        :root {
            --primary: #566387;
            --form-text: #2b3035;
        }
        
        body {
            background: linear-gradient(135deg, #1b1e20 0%, #566387 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .auth-card {
            border: none;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .auth-card-header {
            background: linear-gradient(135deg, #36b9cc 0%, #258391 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .auth-card-body {
            padding: 2rem;
            text-align: center;
        }
        
        .auth-card-footer {
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        .success-icon {
            font-size: 3rem;
            color: #1cc88a;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="auth-card">
                    <div class="auth-card-header">
                        <h3 class="mb-0"><i class="bi bi-envelope-check me-2"></i>Check Your Email</h3>
                    </div>
                    
                    <div class="auth-card-body">
                        <div class="success-icon">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <h4 class="mb-3">Password Reset Sent</h4>
                        <p>
                            We've emailed you instructions for setting your password. 
                            If you don't receive an email, please check your spam folder.
                        </p>
                    </div>
                    
                    <div class="auth-card-footer">
                        <p class="mb-0">Remember your password? <a href="{% url 'login' %}" class="text-primary">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
