<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            overflow-x: hidden;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #343a40 0%, #212529 100%);
            transition: all 0.3s;
            width: 250px;
            position: fixed;
            z-index: 1000;
        }
        .sidebar.collapsed {
            transform: translateX(-250px);
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .sidebar-brand {
            padding: 1.5rem 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
        }
        .content-header {
            background-color: white;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.15rem 0.5rem rgba(0, 0, 0, 0.05);
        }
        .table-container {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.15rem 0.5rem rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }
        .amount-positive {
            color: #28a745;
            font-weight: 500;
        }
        .amount-negative {
            color: #dc3545;
            font-weight: 500;
        }
        .main-content {
            margin-left: 250px;
            transition: all 0.3s;
        }
        .main-content.expanded {
            margin-left: 0;
        }
        .sidebar-toggle {
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 1100;
            display: none;
            background: rgba(0,0,0,0.2);
            border: none;
            color: white;
        }
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-250px);
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .sidebar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <button class="btn sidebar-toggle rounded-circle p-2" id="sidebarToggle">
        <i class="bi bi-list"></i>
    </button>

    <div class="d-flex">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand d-flex align-items-center">
                <a class="nav-link" href="{% url 'index' %}">
                    <i class="bi bi-graph-up me-2"></i>
                    <span>Stock Portfolio</span>
                </a>
            </div>
            <ul class="nav flex-column px-3">
                <li class="nav-item">
                    <a class="nav-link" href="/brokers">
                        <i class="bi bi-bank me-2"></i>Brokers
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/stocks-portfolio">
                        <i class="bi bi-currency-dollar me-2"></i>Stocks
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/transactions">
                        <i class="bi bi-arrow-left-right me-2"></i>Transactions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/earnings-history">
                        <i class="bi bi-graph-up me-2"></i>Earnings History
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dividend_list' %}">
                        <i class="bi bi-currency-exchange me-2"></i>Dividends
                    </a>
                </li>
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link" style="width: 100%; display: flex;">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button>
                    </form>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </a>
                </li>
                {% endif %}
            </ul>
        </nav>
        <div class="main-content flex-grow-1 p-4" id="mainContent">
            <div class="container-fluid">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const mainContent = document.getElementById('mainContent');
            
            // Auto-collapse on small screens
            function checkScreenSize() {
                if (window.innerWidth <= 992) {
                    sidebar.classList.remove('show');
                } else {
                    sidebar.classList.add('show');
                }
            }
            
            // Initial check
            checkScreenSize();
            
            // Toggle sidebar
            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('show');
            });
            
            // Close sidebar when clicking on a link (for mobile)
            document.querySelectorAll('.sidebar .nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 992) {
                        sidebar.classList.remove('show');
                    }
                });
            });
            
            // Update on resize
            window.addEventListener('resize', checkScreenSize);
        });
    </script>
</body>
</html>
